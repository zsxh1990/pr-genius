name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # mcp requires Python >=3.10
          if python3 -c "import sys; assert sys.version_info >= (3,10)"; then
            pip install -e "prgenius[dev,mcp]"
          else
            pip install -e "prgenius[dev]"
          fi

      - name: Run tests
        run: |
          # mcp tests require Python >=3.10
          # Skip tests requiring local pipeline data (evidence/, features/, predictions/)
          SKIP="not test_score_merge and not test_evidence_directory_exists and not test_load_anti_patterns and not test_features_file_exists"
          if python3 -c "import sys; assert sys.version_info >= (3,10)"; then
            python3 -m pytest prgenius/tests/ -v -k "$SKIP"
          else
            python3 -m pytest prgenius/tests/ -v -k "$SKIP and not test_mcp"
          fi
