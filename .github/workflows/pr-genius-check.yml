name: PR Genius Auto Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-genius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pr-genius
        run: pip install prgenius-core

      - name: Run PR Genius coach
        id: genius
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPO: ${{ github.repository }}
        run: |
          # Run coach — use env vars to avoid shell injection from PR body
          RESULT=$(python3 -m prgenius coach "$PR_TITLE" \
            --repo "$PR_REPO" \
            --body "$PR_BODY" \
            --format json 2>/dev/null || echo '{"tier":"unknown","summary":"Analysis failed"}')

          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Extract tier and summary
          TIER=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tier','unknown'))" 2>/dev/null || echo "unknown")
          SUMMARY=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('summary','No summary'))" 2>/dev/null || echo "No summary")

          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          TIER: ${{ steps.genius.outputs.tier }}
          SUMMARY: ${{ steps.genius.outputs.summary }}
          RESULT: ${{ steps.genius.outputs.result }}
        with:
          script: |
            const tier = process.env.TIER || 'unknown';
            const summary = process.env.SUMMARY || 'No summary';
            const result = process.env.RESULT || '{}';

            let emoji = '🟢';
            let status = 'Safe to submit';
            if (tier === 'high_risk') {
              emoji = '🔴';
              status = 'Blocking issues found';
            } else if (tier === 'medium_risk') {
              emoji = '🟡';
              status = 'Review suggestions';
            }

            const body = `## ${emoji} PR Genius\n\n${summary}\n\n<details><summary>Full Analysis</summary>\n\n\`\`\`json\n${result}\n\`\`\`\n</details>\n\n---\n*Powered by [PR Genius](https://github.com/zsxh1990/pr-genius)*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
