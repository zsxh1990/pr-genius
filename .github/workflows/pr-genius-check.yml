name: PR Genius Auto Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # Configuration — override in repo settings > Secrets > Actions
  PR_GENIUS_URL: ${{ vars.PR_GENIUS_URL || 'https://github.com/zsxh1990/pr-genius' }}
  PR_GENIUS_VERSION: ${{ vars.PR_GENIUS_VERSION || 'prgenius-core' }}

jobs:
  pr-genius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pr-genius
        run: pip install ${{ env.PR_GENIUS_VERSION }}

      - name: Get diff stat
        id: diff
        run: |
          # Get diff stat for impact assessment
          # Try HEAD~1 first (single commit), fall back to origin/main (multi-commit)
          DIFF_STAT=$(git diff --stat HEAD~1 HEAD 2>/dev/null || git diff --stat origin/main HEAD 2>/dev/null || echo "")
          echo "stat<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_STAT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run PR Genius coach
        id: genius
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          DIFF_STAT: ${{ steps.diff.outputs.stat }}
        run: |
          # Run coach — use env vars to avoid shell injection from PR body
          # Pass diff_stat for impact assessment (files_changed, breaking_change, etc.)
          RESULT=$(python3 -m prgenius coach "$PR_TITLE" \
            --repo "$PR_REPO" \
            --body "$PR_BODY" \
            --diff-stat "$DIFF_STAT" \
            --format json 2>/dev/null || echo '{"tier":"unknown","summary":"Analysis failed"}')

          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Extract tier and summary
          TIER=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tier','unknown'))" 2>/dev/null || echo "unknown")
          SUMMARY=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('summary','No summary'))" 2>/dev/null || echo "No summary")

          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          TIER: ${{ steps.genius.outputs.tier }}
          SUMMARY: ${{ steps.genius.outputs.summary }}
          RESULT: ${{ steps.genius.outputs.result }}
          PR_GENIUS_URL: ${{ env.PR_GENIUS_URL }}
        with:
          script: |
            const tier = process.env.TIER || 'unknown';
            const summary = process.env.SUMMARY || 'No summary';
            const result = process.env.RESULT || '{}';
            const prGeniusUrl = process.env.PR_GENIUS_URL;

            let emoji = '🟢';
            let status = 'Safe to submit';
            if (tier === 'high_risk') {
              emoji = '🔴';
              status = 'Blocking issues found';
            } else if (tier === 'medium_risk') {
              emoji = '🟡';
              status = 'Review suggestions';
            }

            const body = `## ${emoji} PR Genius\n\n${summary}\n\n<details><summary>Full Analysis</summary>\n\n\`\`\`json\n${result}\n\`\`\`\n</details>\n\n---\n*Powered by [PR Genius](${prGeniusUrl})*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
